<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captain’s Call</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Libre+Baskerville:wght@400;700&display=swap">
<style>
:root{--bg:#f4f7f1;--ink:#1c2a20;--mute:#5b6b5f;--card:#ffffff;--line:#d5ddd0;--g:#2f7a43;--y:#c98a1b;--x:#8d978f;--red:#a8262b}
@media (prefers-color-scheme:dark){:root{--bg:#14201a;--ink:#eef3ec;--mute:#9db0a2;--card:#1d2d24;--line:#2f4437;--g:#3f9a58;--y:#d59a2c;--x:#55655b;--red:#d9484d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:460px;margin:0 auto;padding:20px 16px 40px}
h1,h2{font-family:Georgia,serif;margin:0}
h1{font-size:1.9rem;line-height:1.1}
h2{font-size:1.25rem;margin-bottom:6px}
p{margin:6px 0}
.mute{color:var(--mute);font-size:.92rem}
.board{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--red);padding:0 0 10px;margin-bottom:16px}
.score{font-weight:bold;text-align:right}
.score b{font-size:1.4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
input[type=text],input[type=password]{width:100%;font:bold 1.5rem Georgia,serif;letter-spacing:.35em;text-transform:uppercase;text-align:center;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
button{font:bold 1rem system-ui,sans-serif;padding:12px 18px;border:0;border-radius:8px;background:var(--g);color:#fff;cursor:pointer;width:100%;margin-top:10px}
.field{display:flex;gap:10px;align-items:flex-start;padding:10px;border:2px solid var(--line);border-radius:8px;margin-top:8px;cursor:pointer}
.field.on{border-color:var(--g)}
.field.off{opacity:.45;cursor:not-allowed}
.field input{margin-top:5px}
.row{display:flex;gap:6px;margin:6px 0;justify-content:center}
.t{width:52px;height:52px;display:grid;place-items:center;font:bold 1.6rem Georgia,serif;text-transform:uppercase;border:2px solid var(--line);border-radius:6px;color:#fff}
.t.g{background:var(--g);border-color:var(--g)}.t.y{background:var(--y);border-color:var(--y)}.t.x{background:var(--x);border-color:var(--x)}
.t.n{background:var(--card);color:var(--ink)}
.t.e{color:var(--ink)}
.talk{text-align:center;font-style:italic;color:var(--mute);margin:4px 0 10px;min-height:1.5em}
.warn{background:var(--bg);border-left:4px solid var(--red);padding:8px 12px;border-radius:4px;font-size:.92rem;margin:0 0 14px}
.big{font-size:2.2rem;font-weight:bold;text-align:center;margin:4px 0}
.err{color:var(--red);font-size:.92rem;min-height:1.3em}
.t.q{background:repeating-linear-gradient(45deg,var(--card),var(--card) 6px,var(--line) 6px,var(--line) 12px);color:var(--ink);border:2px dashed var(--red)}
.kb{margin:10px 0}.kr{display:flex;gap:4px;margin-top:6px}
.k{flex:1;width:auto;margin:0;padding:12px 0;font-size:.85rem;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.k[data-k=ENTER],.k[data-k=BACK]{flex:1.6}
.k.g{background:var(--g);color:#fff}.k.y{background:var(--y);color:#fff}.k.x{background:var(--x);color:#fff}

:root{--bg:#efe8d4;--ink:#1b2a1f;--mute:#5d6652;--card:#fbf7ea;--line:#cdc3a5;--g:#2e6b3b;--y:#c4901b;--x:#7b7f73;--red:#9c1c24}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a12;--ink:#efe9d6;--mute:#a9b59c;--card:#18271c;--line:#2f4435;--g:#3d8a4e;--y:#d4a030;--x:#566055;--red:#c0353d}}
body{background:var(--bg) repeating-linear-gradient(90deg,transparent 0,transparent 44px,rgba(46,107,59,.06) 44px,rgba(46,107,59,.06) 88px)}
h1{font-size:1.45rem;letter-spacing:.1em;text-transform:uppercase}
.board{background:#16351f;color:#f3ecd8;border:0;border-bottom:4px solid var(--red);border-radius:6px;padding:14px 16px}
.board .mute{color:#c4cfb2;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem}
.score{color:#f3ecd8;font-size:.9rem}
.score b{color:#f2c14e;font-family:"Courier New",monospace;font-size:1.7rem}
.card{border-radius:4px;border:1px solid var(--line);border-top:3px solid var(--red)}
button{background:var(--red);letter-spacing:.06em;text-transform:uppercase;border-radius:4px}
.k{background:var(--card);border-radius:4px;text-transform:none;letter-spacing:0}
.field{border-radius:4px}.field.on{border-color:var(--red)}
.t{border-radius:3px}
.big{letter-spacing:.04em;text-transform:uppercase}

body{font-family:"Libre Baskerville",Georgia,serif}
h1,h2,.score,.score b,.big,.t,button,.k,input[type=text],input[type=password]{font-family:Oswald,"Arial Narrow",Impact,sans-serif}
.t{font-weight:700}
summary{cursor:pointer;font-family:Oswald,"Arial Narrow",sans-serif;letter-spacing:.08em;text-transform:uppercase}
@media (prefers-color-scheme:dark){
:root{--bg:#12151c;--ink:#ece7da;--mute:#a4a9b6;--card:#1b2029;--line:#2f3645;--g:#3f9a5a;--y:#d9a42f;--x:#5b6270;--red:#cf444b}
body{background:var(--bg)}
.board{background:#0b0e14}
}
.nm{font-size:1.1rem!important;letter-spacing:.05em!important;text-transform:none!important}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.scw{overflow-x:auto;margin:14px 0}
.sc{width:100%;border-collapse:collapse;font-size:.9rem}
.sc th,.sc td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.sc th{font-family:Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;color:var(--mute)}
.sc .r{text-align:right;white-space:nowrap}
.sc tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
</style>

var FB=String(window.CCALL_FB||"https://captains-call-3e319-default-rtdb.asia-southeast1.firebasedatabase.app").replace(/\/+$/,"");
var POLL_MS=window.CCALL_POLL_MS||1300,AWAY_MS=window.CCALL_AWAY_MS||30000;
var online={code:"",inbox:[],tok:0,id:"",peerId:"",seq:0,seen:-1,offline:false,away:false,queue:[],sending:false,lastKey:"",keys:{},isHost:false,t:{},beatAt:0,beatVal:null};
function rawName(x,d){return String(x==null?"":x).trim().slice(0,14)||d}
function why(e){var m=(e&&e.message)||"";return /^http /.test(m)?" ["+m+"]":" [network]"}
function configured(){return FB.indexOf("PASTE")<0&&/^https:\/\//.test(FB)||/^http:\/\/127\.0\.0\.1/.test(FB)}
function net(){
 var msg=online.offline?"Reconnecting…":(online.away?"Your friend’s connection dropped. Waiting for them to return…":"");
 var e=document.getElementById("net");
 if(!e){if(!msg)return;e=document.createElement("div");e.id="net";e.setAttribute("style","position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#9c1c24;color:#fff;padding:8px 14px;border-radius:6px;font:14px system-ui,sans-serif;z-index:9;max-width:90%;text-align:center");document.body.appendChild(e)}
 e.style.display=msg?"block":"none";e.textContent=msg}
function db(path,o){
 o=o||{};var m=o.m||"GET",q=o.q||"";
 var url=FB+"/"+path+".json";
 var override=(m==="PUT"||m==="DELETE"||m==="PATCH");
 var qs=[];if(q)qs.push(q);if(override)qs.push("x-http-method-override="+m);
 if(qs.length)url+="?"+qs.join("&");
 var ctl=(typeof AbortController!=="undefined")?new AbortController():null;
 var timer=setTimeout(function(){if(ctl)ctl.abort()},9000);
 var init={method:m==="GET"?"GET":"POST"};
 if(ctl)init.signal=ctl.signal;
 if(o.body!==undefined){init.body=JSON.stringify(o.body);init.headers={"Content-Type":"text/plain"}}
 return fetch(url,init).then(function(r){clearTimeout(timer);if(!r.ok)throw new Error("http "+r.status);return r.json()},function(e){clearTimeout(timer);throw e})}
online.genCode=function(){var A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",c="";for(var i=0;i<5;i++)c+=A[rnd(A.length)];return c};
online.clean=function(){
 var code=online.code,paired=online.peerId,host=online.isHost,id=online.id;
 if(code&&id){
  if(paired)db("rooms/"+code+"/msgs",{m:"POST",body:{t:"bye",from:id,n:++online.seq,rd:0,ep:0}}).catch(function(){});
  else if(host)db("rooms/"+code,{m:"DELETE"}).catch(function(){})}
 online.tok++;
 for(var k in online.t)clearTimeout(online.t[k]);
 online.t={};online.inbox=[];online.queue=[];online.sending=false;online.peerId="";online.code="";online.lastKey="";online.keys={};
 online.offline=false;online.away=false;S.busy=false;net()};
online.send=function(m){
 if(m.rd===undefined)m.rd=S.round;if(m.ep===undefined)m.ep=S.epoch;
 m.from=online.id;m.n=++online.seq;
 online.queue.push(m);online.flush()};
online.flush=function(){
 if(online.sending||!online.queue.length||!online.code)return;
 var tok=online.tok,m=online.queue[0];online.sending=true;
 db("rooms/"+online.code+"/msgs",{m:"POST",body:m}).then(function(){
  if(tok!==online.tok)return;
  online.queue.shift();online.sending=false;
  if(online.offline){online.offline=false;net()}
  online.flush()},function(){
  if(tok!==online.tok)return;
  online.sending=false;online.offline=true;net();
  online.t.flush=setTimeout(function(){if(tok===online.tok)online.flush()},2000)})};
online.fail=function(msg,to){online.clean();S.err=msg;S.mode="online";S.phase=to||"olobby";render()};
online.reset=function(who){online.clean();S.mode="online";S.me=who;S.round=0;S.epoch=0;S.pts=[0,0];S.card=[];S.err="";S.busy=false;S.phase="connecting";
 online.isHost=(who===0);online.id="c"+Math.random().toString(36).slice(2,10);online.seq=0;online.seen=-1;online.peerId=""};
online.poll=function(tok){
 if(tok!==online.tok)return;
 var q='orderBy='+encodeURIComponent('"$key"')+(online.lastKey?'&startAt='+encodeURIComponent('"'+online.lastKey+'"'):'');
 db("rooms/"+online.code+"/msgs",{q:q}).then(function(d){
  if(tok!==online.tok)return;
  if(online.offline&&!online.queue.length){online.offline=false;net()}
  if(d&&typeof d==="object"){
   var ks=Object.keys(d).sort();
   for(var i=0;i<ks.length;i++){
    if(tok!==online.tok)return;
    var k=ks[i];if(online.keys[k])continue;
    online.keys[k]=1;online.lastKey=k;online.recv(d[k])}}
 },function(){
  if(tok!==online.tok)return;online.offline=true;net()
 }).then(function(){
  if(tok!==online.tok)return;
  online.t.poll=setTimeout(function(){online.poll(tok)},document.hidden?Math.max(POLL_MS,4000):POLL_MS)})};
online.beat=function(tok){
 if(tok!==online.tok)return;
 db("rooms/"+online.code+"/presence/"+online.id,{m:"PUT",body:{".sv":"timestamp"}}).catch(function(){});
 online.t.beat=setTimeout(function(){online.beat(tok)},8000)};
online.watch=function(tok){
 if(tok!==online.tok)return;
 if(online.peerId){
  db("rooms/"+online.code+"/presence/"+online.peerId).then(function(v){
   if(tok!==online.tok)return;
   if(v!==null&&v!==online.beatVal){online.beatVal=v;online.beatAt=Date.now();if(online.away){online.away=false;net()}}
   else if(online.beatAt&&Date.now()-online.beatAt>AWAY_MS&&!online.away){online.away=true;net()}
  },function(){})}
 online.t.watch=setTimeout(function(){online.watch(tok)},Math.min(6000,AWAY_MS/3))};
online.start=function(tok){online.poll(tok);online.beat(tok);online.watch(tok)};
online.recv=function(m){
 if(!m||typeof m.t!=="string"||typeof m.from!=="string"||m.from===online.id)return;
 if(!online.peerId){
  if(m.t==="hi"&&S.me===0&&S.phase==="hosting"){online.peerId=m.from;online.seen=-1}
  else if(m.t==="start"&&S.me===1&&S.phase==="connecting"&&m.to===online.id){online.peerId=m.from;online.seen=-1}
  else return;
  online.beatAt=Date.now();online.beatVal=null}
 else if(m.from!==online.peerId)return;
 if(typeof m.n==="number"){if(m.n<=online.seen)return;online.seen=m.n}
 if(m.t==="bye"){
  var rc=online.code;online.peerId="";online.clean();
  if(rc)db("rooms/"+rc,{m:"DELETE"}).catch(function(){});
  S.phase="gone";render();return}
 online.handle(m)};
online.host=function(){
 online.reset(0);var tok=online.tok;render();
 if(!configured()){online.fail("Online play is not set up yet.");return}
 var tries=0;
 var attempt=function(){
  var code=online.genCode();
  db("rooms/"+code+"/meta").then(function(meta){
   if(tok!==online.tok)return;
   if(meta&&tries++<6){attempt();return}
   return db("rooms/"+code+"/meta",{m:"PUT",body:{host:online.id,created:{".sv":"timestamp"}}}).then(function(){
    if(tok!==online.tok)return;
    online.code=code;S.phase="hosting";render();online.start(tok)})
  }).catch(function(e){
   if(tok!==online.tok)return;
   online.fail("Could not reach the online server"+why(e)+". Check your internet connection, then try again.")})};
 attempt()};
online.join=function(code){
 online.reset(1);var tok=online.tok;S.joinCode=code;render();
 if(!configured()){online.fail("Online play is not set up yet.","ojoin");return}
 db("rooms/"+code+"/meta").then(function(meta){
  if(tok!==online.tok)return;
  if(!meta){online.fail("No room found with that code.","ojoin");return}
  online.code=code;online.start(tok);
  online.send({t:"hi",name:S.myName,rd:0,ep:0});
  online.t.to=setTimeout(function(){if(tok===online.tok&&S.phase==="connecting")online.fail("No reply from that room. Check the code, and ask your friend to keep the room screen open.","ojoin")},25000)
 },function(e){
  if(tok!==online.tok)return;
  online.fail("Could not reach the online server"+why(e)+". Check your internet connection, then try again.","ojoin")})};
online.startRound=function(){
 S.guesses=[];S.last="";S.wicket=0;S.gaveUp=0;S.word="";S.fields=[];S.hint="";S.busy=false;S.wantGive=false;
 S.phase=bowler()===S.me?"setup":"wait";render();online.drain()};
online.drain=function(){var q=online.inbox;online.inbox=[];q.forEach(online.handle)};
online.next=function(){S.round++;if(S.round<ROUNDS)online.startRound();else{S.phase="final";render();online.drain()}};
online.rematch=function(){S.epoch++;online.inbox=online.inbox.filter(function(x){return x.t!=="rematch"});online.send({t:"rematch",ep:S.epoch,rd:0});S.pts=[0,0];S.card=[];S.round=0;online.startRound()};
online.call=function(){
 online.send({t:"call",fields:S.fields,hint:S.hint?{p:S.hintP,l:S.word[S.hintP]}:null});
 S.hint="";S.phase="watch";render()};
online.guess=function(g){S.busy=true;clearInterval(T);var e=document.getElementById("err");if(e)e.textContent="Waiting for the bowler…";online.send({t:"guess",g:g})};
online.timeout=function(){if(S.busy)return;S.busy=true;online.send({t:"timeout"})};
online.giveup=function(){if(S.busy){S.wantGive=true;var e=document.getElementById("err");if(e)e.textContent="Waiting for the last ball. Your give-up will go through next.";return}S.busy=true;clearInterval(T);online.send({t:"giveup"})};
online.finish=function(kind,n){
 S.wicket=kind==="solved"?0:1;S.gaveUp=kind==="giveup"?1:0;
 if(kind==="solved")S.last=S.names[batter()]+" scores "+n+" runs.";
 else if(kind==="giveup")S.last=S.names[batter()]+" gives up. "+S.names[bowler()]+" takes the wicket and "+n+" runs.";
 else S.last=S.names[bowler()]+" takes the wicket and "+n+" runs.";
 record(kind,n);S.wantGive=false;S.busy=false;S.phase="result";render()};
online.resolve=function(w,r,kind){
 if(w)S.guesses.push({w:w,r:r});
 var n=0;
 if(kind==="solved"){n=7-S.guesses.length+(has("body")&&S.guesses.length<=3?2:0);S.pts[batter()]+=n}
 else if(kind==="giveup"||S.guesses.length>=maxBalls()){kind=kind||"fail";n=2+cost(S.fields)+(has("body")?3:0);S.pts[bowler()]+=n}
 else kind=null;
 online.send({t:"res",w:w,r:r,k:kind,amt:n,pts:S.pts.slice(),word:kind?S.word:null});
 if(kind)online.finish(kind,n);else render()};
online.handle=function(m){
 if(!m||typeof m.t!=="string")return;
 var ep=m.ep|0,rd=m.rd|0;
 if(m.t==="rematch"){
  if(ep<=S.epoch)return;
  if(S.phase==="final"){S.epoch=ep;S.pts=[0,0];S.card=[];S.round=0;online.startRound()}else online.inbox.push(m);
  return}
 if(ep<S.epoch)return;
 if(ep>S.epoch||rd>S.round){online.inbox.push(m);return}
 if(m.t==="hi"){
  if(S.me!==0||S.phase!=="hosting"||!online.peerId)return;
  var hn=rawName(S.myName,"Player A"),gn=rawName(m.name,"Player B");
  S.names=[esc(hn),esc(gn)];online.send({t:"start",names:[hn,gn],to:online.peerId,rd:0,ep:0});
  S.pts=[0,0];S.card=[];S.round=0;online.startRound();return}
 if(m.t==="start"){
  if(S.me!==1||S.phase!=="connecting"||!Array.isArray(m.names))return;
  clearTimeout(online.t.to);
  S.names=[esc(rawName(m.names[0],"Player A")),esc(rawName(m.names[1],"Player B"))];
  S.pts=[0,0];S.card=[];S.round=0;online.startRound();return}
 if(m.t==="call"){
  if(S.phase!=="wait"||batter()!==S.me)return;
  var fl=(Array.isArray(m.fields)?m.fields:[]).filter(function(k,i,a){return F[k]&&a.indexOf(k)===i});
  S.fields=fl;S.hint="";
  if(m.hint&&(m.hint.p|0)===m.hint.p&&m.hint.p>=0&&m.hint.p<5&&/^[a-z]$/.test(m.hint.l))S.hint="Free hint: letter "+(m.hint.p+1)+" is "+m.hint.l.toUpperCase()+".";
  S.guesses=[];S.last="";S.busy=false;S.phase="play";render();return}
 if(m.t==="guess"||m.t==="timeout"||m.t==="giveup"){
  if(S.phase!=="watch"||bowler()!==S.me)return;
  if(m.t==="guess"){
   var g=m.g;if(typeof g!=="string"||!validWord(g)||S.guesses.length>=maxBalls())return;
   online.resolve(g,applyFields(score(g,S.word),g,S.guesses.length+1),g===S.word?"solved":null)}
  else if(m.t==="timeout"){if(S.guesses.length>=maxBalls())return;online.resolve("-----",["e","e","e","e","e"],null)}
  else online.resolve(null,null,"giveup");
  return}
 if(m.t==="res"){
  if(S.phase!=="play"||batter()!==S.me)return;
  if(m.w!=null){
   var okr=Array.isArray(m.r)&&m.r.length===5&&m.r.every(function(c){return "gyxqe".indexOf(c)>-1});
   if(typeof m.w!=="string"||!(m.w==="-----"||/^[a-z]{5}$/.test(m.w))||!okr)return;
   S.guesses.push({w:m.w,r:m.r});
   S.last=m.r[0]==="e"?"Too slow! That ball is gone.":(m.r.indexOf("q")>-1?"Slip cordon! One letter is being hidden from you.":talk(m.r))}
  S.busy=false;
  if(m.k==="solved"||m.k==="fail"||m.k==="giveup"){
   if(typeof m.word!=="string"||!/^[a-z]{5}$/.test(m.word))return;
   if(Array.isArray(m.pts)&&m.pts.length===2&&m.pts.every(function(x){return typeof x==="number"&&isFinite(x)}))S.pts=[m.pts[0],m.pts[1]];
   S.word=m.word;online.finish(m.k,Math.max(0,Math.min(99,m.amt|0)))}
  else{render();if(S.wantGive){S.wantGive=false;online.giveup()}}
  return}
};

 var go=document.getElementById("go"),bowl=document.getElementById("bowl"),nx=document.getElementById("next"),ag=document.getElementById("again");
 if(go){
  var boxes=[].slice.call(app.querySelectorAll('input[type=checkbox]'));
  var refresh=function(){
   var on=boxes.filter(function(x){return x.checked}).map(function(x){return x.value});
   var used=cost(on);
   document.getElementById("bud").textContent=used;
   boxes.forEach(function(x){
    var lab=x.closest(".field");
    lab.classList.toggle("on",x.checked);
    var blocked=!x.checked&&used+F[x.value].c>BUDGET;
    x.disabled=blocked;lab.classList.toggle("off",blocked)})};
  boxes.forEach(function(b){b.onchange=refresh});refresh();
  document.getElementById("w").focus();
  go.onclick=function(){
   var w=document.getElementById("w").value.toLowerCase().trim();
   if(!validWord(w)){document.getElementById("err").textContent=/^[a-z]{5}$/.test(w)?"That word is not in the dictionary.":"Enter exactly five letters, A to Z.";return}
   S.word=w;S.fields=boxes.filter(function(x){return x.checked}).map(function(x){return x.value});
   S.guesses=[];S.last="";S.wicket=0;S.gaveUp=0;S.hint="";S.slipLetter=w[rnd(5)];
   if(cost(S.fields)>=BUDGET){var ok=[0,1,2,3,4].filter(function(i){return !has("slip")||w[i]!==S.slipLetter});var p=ok.length?pick(ok):rnd(5);S.hintP=p;S.hint="Free hint: letter "+(p+1)+" is "+w[p].toUpperCase()+"."}
   if(S.mode==="online"){online.call();return}
   S.phase="play";render()}}
 if(bowl){
  var inp=document.getElementById("g");inp.setAttribute("inputmode","none");inp.focus();
  if(has("fast")&&!S.busy){var tl=30,tm=document.getElementById("tm");tm.textContent="Time: 30s";T=setInterval(function(){tl--;tm.textContent="Time: "+tl+"s";if(tl<=0){clearInterval(T);if(S.mode==="online"){online.timeout();return}S.guesses.push({w:"-----",r:["e","e","e","e","e"]});S.last="Too slow! That ball is gone.";after("")}},1000)}
  var fire=function(){
   if(S.busy)return;
   var g=inp.value.toLowerCase().trim();
   if(!validWord(g)){document.getElementById("err").textContent=/^[a-z]{5}$/.test(g)?"Not in the dictionary. Try another word.":"Enter exactly five letters, A to Z.";return}
   if(has("silly")){var bad="";S.guesses.forEach(function(pg){if(pg.r[0]==="e")return;pg.r.forEach(function(c,j){if(c==="g"&&g[j]!==pg.w[j])bad="Silly point: keep "+pg.w[j].toUpperCase()+" in place "+(j+1)+".";if(c==="y"&&g.indexOf(pg.w[j])<0)bad="Silly point: you must reuse "+pg.w[j].toUpperCase()+"."})});if(bad){document.getElementById("err").textContent=bad;return}}
   if(S.mode==="online"){online.guess(g);return}
   var r=applyFields(score(g,S.word),g,S.guesses.length+1);
   S.guesses.push({w:g,r:r});S.last=r.indexOf("q")>-1?"Slip cordon! One letter is being hidden from you.":talk(r);after(g)};
  bowl.onclick=fire;
  app.querySelectorAll(".k").forEach(function(b){b.onclick=function(){var v=b.getAttribute("data-k");if(v==="ENTER")fire();else if(v==="BACK")inp.value=inp.value.slice(0,-1);else if(inp.value.length<5)inp.value+=v.toLowerCase()}});inp.onkeydown=function(e){if(e.key==="Enter")fire()}}
 var gu=document.getElementById("giveup");
 if(gu){var armed=false;gu.onclick=function(){
  if(!armed){armed=true;gu.textContent="Tap again to confirm";setTimeout(function(){if(document.body.contains(gu)){armed=false;gu.textContent="Give up"}},4000);return}
  giveUp()}}
 if(nx)nx.onclick=function(){if(S.mode==="online"){online.next();return}if(S.mode==="practice"){compSetup();render();return}S.round++;S.phase=S.round<ROUNDS?"setup":"final";render()};
 if(ag)ag.onclick=function(){S.pts=[0,0];S.card=[];S.round=0;S.phase="menu";S.mode="";render()};
 var pm=document.getElementById("pm"),mm=document.getElementById("mm"),st=document.getElementById("st"),bk=document.getElementById("bk"),fin=document.getElementById("fin");
 if(pm)pm.onclick=function(){S.mode="practice";S.phase="names";render()};
 if(mm)mm.onclick=function(){S.mode="match";S.phase="names";render()};
 if(bk)bk.onclick=function(){online.clean();S.pts=[0,0];S.card=[];S.round=0;S.mode="";S.phase="menu";render()};
 if(fin)fin.onclick=function(){S.phase="final";render()};
 var om=document.getElementById("om"),mk=document.getElementById("mk"),jn=document.getElementById("jn"),cp=document.getElementById("cp"),rm=document.getElementById("rm");
 if(om)om.onclick=function(){S.mode="online";S.phase="oname";S.err="";S.fromLink=false;render()};
 var on=document.getElementById("on"),cd=document.getElementById("cd"),onx=document.getElementById("onx"),jn0=document.getElementById("jn0"),bl=document.getElementById("bl"),cn=document.getElementById("cn");
 if(on){on.focus();on.onkeydown=function(e){if(e.key==="Enter")onx.click()}}
 if(onx)onx.onclick=function(){S.myName=on.value.trim().slice(0,14);try{localStorage.setItem("cc_name",S.myName)}catch(e){}S.err="";S.phase=(S.fromLink&&S.joinCode.length===5)?"ojoin":"olobby";render()};
 if(cn)cn.onclick=function(){S.err="";S.fromLink=false;S.phase="oname";render()};
 if(mk)mk.onclick=function(){S.err="";online.host()};
 if(jn0)jn0.onclick=function(){S.err="";S.phase="ojoin";render()};
 if(bl)bl.onclick=function(){S.err="";S.phase="olobby";render()};
 if(cd){cd.focus();cd.onkeydown=function(e){if(e.key==="Enter")jn.click()};
  jn.onclick=function(){var c=cd.value.toUpperCase().replace(/[^A-Z0-9]/g,"");S.joinCode=c;if(c.length!==5){S.err="Enter the 5-character room code.";render();return}online.join(c)}}
 var sh=document.getElementById("sh");
 if(cp)cp.onclick=function(){var link=inviteLink();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(link).then(function(){cp.textContent="Link copied"},function(){legacyCopy(link,cp)})}
  else legacyCopy(link,cp)};
 if(sh)sh.onclick=function(){try{navigator.share({url:inviteLink()}).catch(function(){})}catch(e){}};
 if(rm)rm.onclick=function(){online.rematch()};
 if(st){var n1=document.getElementById("n1"),n2=document.getElementById("n2");n1.focus();st.onclick=function(){
  S.pts=[0,0];S.card=[];S.round=0;S.solved=0;S.tot=0;
  if(S.mode==="practice"){S.names=[esc(n1.value.trim()||"You"),"The computer"];compSetup();render()}
  else{S.names=[esc(n1.value.trim()||"Player A"),esc(n2.value.trim()||"Player B")];S.phase="setup";render()}}}
}
try{S.myName=(localStorage.getItem("cc_name")||"").slice(0,14)}catch(e){}
try{var qr=(new URLSearchParams(location.search).get("room")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5);if(qr.length===5){S.mode="online";S.phase="oname";S.joinCode=qr;S.fromLink=true}}catch(e){}
render();
})();
</script>
</body>
</html>
